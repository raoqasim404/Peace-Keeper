<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromiseKeeper</title>
<style>
  :root { --ink:#1b2430; --mute:#5f6b78; --paper:#f4f6f8; --card:#fff; --line:#d6dce3; --accent:#0b6e6e; --ok:#18794e; --bad:#b42318; --warn:#9a6700; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8edf2; --mute:#9aa6b2; --paper:#11161b; --card:#1a2128; --line:#2b343d; --accent:#4fc3c3; --ok:#4ccf94; --bad:#ff8a80; --warn:#e5b94e; color-scheme: dark; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper); }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  h1 { font-size:1.2rem; margin:0; }
  h2 { font-size:1.05rem; margin:0 0 8px; }
  button { font:inherit; min-height:44px; padding:8px 14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; cursor:pointer; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button[aria-pressed="true"], button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  nav { display:flex; gap:8px; padding:12px 16px 0; overflow-x:auto; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .meta { color:var(--mute); font-size:.9rem; }
  .err { color:var(--bad); }
  ul.promises { list-style:none; padding:0; margin:8px 0; }
  ul.promises li { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); }
  ul.promises input { width:22px; height:22px; margin-top:2px; flex:none; }
  .steps { display:grid; gap:8px; margin-top:10px; }
  .step { display:flex; justify-content:space-between; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .badge { font-size:.85rem; padding:2px 10px; border-radius:999px; border:1px solid currentColor; }
  .ok { color:var(--ok); } .failed, .error { color:var(--bad); } .skipped { color:var(--mute); } .running { color:var(--warn); }
  iframe { width:100%; height:640px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  td,th { text-align:left; padding:6px 4px; border-top:1px solid var(--line); vertical-align:top; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<header>
  <h1>PromiseKeeper</h1>
  <div class="row" role="group" aria-label="Switch customer" id="who"></div>
</header>
<nav id="tabs" role="tablist"></nav>
<main>
  <p id="status" class="meta" role="status"></p>
  <section id="view-connect" hidden>
    <p class="meta">Connect your own tools. Each customer only sees and uses their own accounts.</p>
    <iframe id="widget" title="Connect your tools" allow="clipboard-write"></iframe>
  </section>
  <section id="view-deals" hidden>
    <div class="row" style="margin-bottom:12px"><button class="primary" id="scan">Scan won deals</button></div>
    <div id="deals"></div>
  </section>
  <section id="view-log" hidden>
    <div class="row" style="margin-bottom:12px"><button id="refreshLog">Refresh</button></div>
    <div class="card scroll"><table><thead><tr><th>Time</th><th>Event</th><th>Detail</th></tr></thead><tbody id="logRows"></tbody></table></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let cur = null, curName = "";
const setStatus = (t, bad) => { $("status").textContent = t; $("status").className = "meta" + (bad ? " err" : ""); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const api = async (url, opt) => { const r = await fetch(url, opt); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; };

const TABS = [["connect","Connect tools"],["deals","Deals"],["log","Activity"]];
function showTab(name) {
  TABS.forEach(([k]) => { $("view-"+k).hidden = k !== name; });
  [...$("tabs").children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === name)));
  if (name === "connect") loadWidget();
  if (name === "log") loadLog();
}

async function loadWidget() {
  setStatus(`Loading ${curName}…`);
  try {
    const get = async () => { const r = await fetch(`/api/embed/${cur}`); return { ok: r.ok, j: await r.json() }; };
    let t = await get();
    if (!t.ok && String(t.j.body).includes("IDENTITY_ORG_NOT_FOUND")) {
      await fetch(`/api/register/${cur}`, { method: "POST" });
      t = await get();
    }
    if (!t.ok) throw new Error(t.j.error + " (" + t.j.upstreamStatus + ")");
    $("widget").src = t.j.iframeUrl; setStatus("");
  } catch (e) { setStatus(e.message, true); }
}

async function scan() {
  setStatus("Scanning won deals…"); $("deals").innerHTML = "";
  try {
    const { deals } = await api(`/api/deals/${cur}`);
    setStatus(deals.length ? "" : "No Closed Won deals found. Mark a deal as Closed Won in HubSpot and scan again.");
    deals.forEach(renderDeal);
  } catch (e) { setStatus("Could not scan deals: " + e.message, true); }
}

function renderDeal(d) {
  const el = document.createElement("div"); el.className = "card";
  el.innerHTML = `<h2>${esc(d.name)}</h2><div class="meta">Deal ${esc(d.id)} · $${esc(d.amount)}</div>
    <p class="meta" style="margin-bottom:0">Promises found in notes. Untick any that are wrong, then approve.</p>
    <ul class="promises">${d.promises.map((p,i)=>`<li><input type="checkbox" id="p${d.id}_${i}" checked><label for="p${d.id}_${i}">${esc(p)}</label></li>`).join("")}</ul>
    <button class="primary approve">Approve and create handoff</button><div class="steps"></div>`;
  $("deals").append(el);
  const steps = el.querySelector(".steps"), btn = el.querySelector(".approve");
  const picked = () => d.promises.filter((_, i) => el.querySelector(`#p${d.id}_${i}`).checked);
  const draw = (list) => {
    steps.innerHTML = list.map((s) => `<div class="step"><span>${esc(s.step)}</span><span class="row"><span class="badge ${esc(s.status)}">${esc(s.status)}</span>${s.status==="failed"||s.status==="error"?`<button data-retry="${esc(s.step)}">Retry</button>`:""}</span></div>`).join("");
    steps.querySelectorAll("[data-retry]").forEach((b) => b.onclick = () => run([b.dataset.retry]));
  };
  async function run(only) {
    btn.disabled = true; setStatus("Running handoff…");
    try {
      const r = await api(`/api/handoff/${cur}`, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ deal: d, promises: picked(), only }) });
      draw(r.steps); setStatus("");
    } catch (e) { setStatus("Handoff failed: " + e.message + ". Check the connection under Connect tools, then retry.", true); }
    btn.disabled = false;
  }
  btn.onclick = () => run();
}

async function loadLog() {
  try {
    const { log } = await api(`/api/audit/${cur}`);
    $("logRows").innerHTML = log.length ? log.map((l) => `<tr><td>${esc(new Date(l.at).toLocaleTimeString())}</td><td>${esc(l.event)}</td><td>${esc(l.status||l.error||l.count||l.deal||"")}</td></tr>`).join("") : `<tr><td colspan="3" class="meta">No activity yet.</td></tr>`;
  } catch (e) { setStatus(e.message, true); }
}

function pick(id, name) {
  cur = id; curName = name; $("deals").innerHTML = "";
  [...$("who").children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
  showTab("connect");
}

(async () => {
  TABS.forEach(([k, label]) => { const b = document.createElement("button"); b.textContent = label; b.dataset.k = k; b.onclick = () => showTab(k); $("tabs").append(b); });
  $("scan").onclick = scan; $("refreshLog").onclick = loadLog;
  const cs = await api("/api/companies");
  cs.forEach((c) => { const b = document.createElement("button"); b.textContent = c.name; b.dataset.id = c.id; b.onclick = () => pick(c.id, c.name); $("who").append(b); });
  pick(cs[0].id, cs[0].name);
})();
</script>
</body>
</html>
